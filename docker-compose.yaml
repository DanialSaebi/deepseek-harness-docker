services:
  deepseek-harness:
    build: .
    container_name: deepseek-harness

    ports:
      - "${PORT:-3000}:3000"

    environment:
      TRUSTED_HOST: "${TRUSTED_HOST:-localhost:3000}"

    volumes:
      - ./data:/root/.dsh

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"